name: Release

# Builds cljrsh and cljrs distribution binaries for a tag and attaches
# them to a GitHub Release. Both ship in one tarball per platform so the
# asset set stays one-per-target — mise's github: backend then selects
# the asset unambiguously (separate cljrs-*/cljrsh-* assets would be
# prefix-ambiguous there) and shims every executable it finds inside,
# so one tool entry serves both binaries: exe= only picks the install
# binary, it never restricts shimming.
#
# Tags are pushed by the Publish workflow with the workflow's own
# GITHUB_TOKEN, and such pushes never trigger other workflows — so
# Publish *calls* this workflow after a successful crates.io publish.
# workflow_dispatch covers manual runs and backfills; with no tag given
# it releases the newest v* tag.
#
# TREAT PUBLISHED TAGS AS IMMUTABLE: re-dispatching against an
# already-released tag with different build content replaces the assets
# in place, and every installer that cached the old checksums (mise/ubi
# record them from release metadata) fails closed with a misleading
# "lockfile ... Checksum mismatch" until its HTTP cache is cleared
# (~/.cache/mise on Linux, ~/Library/Caches/mise on macOS). Backfill an
# existing tag only to repair a failed upload of the SAME content; for
# content changes, cut a new tag.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release (default: newest)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "no such tag: $TAG" >&2
            exit 1
          fi
          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}

      - name: Build (dist profile)
        run: cargo build --profile dist -p cljrsh -p cljrs --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          DIST=target/${{ matrix.target }}/dist
          "$DIST/cljrsh" --version
          test "$("$DIST/cljrsh" -e '(+ 1 2)')" = "3"
          "$DIST/cljrs" --version
          test "$("$DIST/cljrs" eval '(+ 1 2)')" = "3"

      # Version-free asset names keep releases/latest/download/ URLs stable.
      - name: Package
        run: |
          STAGE=cljrsh-${{ matrix.target }}
          mkdir "$STAGE"
          cp target/${{ matrix.target }}/dist/cljrsh \
             target/${{ matrix.target }}/dist/cljrs \
             crates/cljrsh/README.md "$STAGE"/
          tar czf "$STAGE.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: cljrsh-${{ matrix.target }}
          path: cljrsh-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ needs.resolve.outputs.tag }}
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "cljrsh $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" assets/* --clobber
