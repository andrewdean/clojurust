name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  restricted-transaction:
    name: Restricted transaction profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test restricted resolver
        run: cargo test -p cljrs-env --no-default-features restricted_profile_returns_a_stable_policy_error

      - name: Test restricted transaction runtime
        run: cargo test -p cljrs-tx --no-default-features --features no-gc

      - name: Check restricted dependency graph
        shell: bash
        run: |
          forbidden='^(cljrs-deps|cljrs-vcs|gix|pgp|ssh-key) '
          if cargo tree -p cljrs-tx --no-default-features --features no-gc \
            --edges normal --prefix none | sort -u | grep -E "$forbidden"; then
            echo "restricted transaction graph contains a forbidden package" >&2
            exit 1
          fi

  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Clojure Tests
        run: cargo run -p cljrs compile -o test-suite --test ./clojure-test-suite/test && CLJRS_GC_STATS=- ./test-suite

      - name: Graph sample (region-alloc smoke test)
        env:
          CLJRS_GC_STATS: "-"
        run: cargo run -p cljrs compile -o graph-sample samples/graph.cljrs && ./graph-sample

      - name: Game of Life (bump-allocator showcase)
        env:
          CLJRS_GC_STATS: "-"
        run: cargo run -p cljrs compile -o life-sample samples/life.cljrs && ./life-sample

      - name: core.async sample (CSP showcase)
        run: cargo run -p cljrs compile -o async-sample samples/core_async.cljrs && ./async-sample

      - name: HTTP GET sample (net + charset showcase)
        run: cargo run -p cljrs compile -o http-get-sample samples/http_get.cljrs && ./http-get-sample

  wasm:
    name: WASM build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build cljrs-wasm
        run: wasm-pack build crates/cljrs-wasm --target web --no-typescript --release
