[package]
name = "cljrsh-host"
version = "0.1.0"
edition = "2024"
description = "cljrsh host library surface: native cljrsh.* namespaces (fs, json, ...) plus the embedded babashka.* compatibility layer"
license.workspace = true
repository.workspace = true

[dependencies]
cljrs-env     = { workspace = true }
cljrs-interop = { workspace = true }
cljrs-gc      = { workspace = true }
cljrs-value   = { workspace = true }
cljrs-process = { workspace = true }
cljrs-builtins = { workspace = true }
cljrs-reader  = { workspace = true }
serde_json = "1"
walkdir    = "2"
globset    = "0.4"
tempfile   = "3"
which      = "7"
uuid       = { workspace = true }
yaml-rust2 = "0.10"
csv        = "1"
reqwest    = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "query", "form"] }

sha2 = "0.10"
hex = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
cljrs-interp = { workspace = true }
cljrs-stdlib = { workspace = true }
