[package]
name = "cljrs-qt"
version = "0.2.28"
edition = "2024"
description = "cljrs embedded in a Qt/QML host — C ABI cdylib around an nREPL-centered interpreter thread"
license.workspace = true
repository.workspace = true

[lib]
name = "cljrs_qt"
crate-type = ["cdylib"]

[dependencies]
cljrs-eval    = { workspace = true }
cljrs-stdlib  = { workspace = true }
cljrs-value   = { workspace = true }
cljrs-gc      = { workspace = true }
cljrs-nrepl   = { workspace = true }
cljrs-bencode = { workspace = true }
