[package]
name = "cljrsh-aws"
version = "0.2.23"
edition = "2024"
description = "Minimal data-driven AWS client for cljrsh: SigV4 + S3 (rest-xml) + generic awsJson invoke, Garage-compatible, static/IRSA auth"
license.workspace = true
repository.workspace = true

[dependencies]
cljrs-env     = { workspace = true }
cljrs-interop = { workspace = true }
cljrs-gc      = { workspace = true }
cljrs-value   = { workspace = true }
cljrsh-host   = { workspace = true }
aws-sigv4 = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"
cljrs-types = { workspace = true }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip"] }
serde_json = "1"

[dev-dependencies]
cljrs-interp = { workspace = true }
cljrs-stdlib = { workspace = true }
cljrs-reader = { workspace = true }
