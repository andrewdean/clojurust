[package]
name = "cljrs-builtins"
version = "0.2.41"
edition = "2024"
description = "Built-in function implementations for clojurust (arithmetic, collections, I/O, regex)"
license.workspace = true
repository.workspace = true

[features]
default = ["host-dependencies"]
host-dependencies = ["cljrs-env/host-dependencies"]
no-gc = ["cljrs-gc/no-gc"]

[dependencies]
indexmap = "2"
cljrs-env = { path = "../cljrs-env", version = "0.2.41", default-features = false }
cljrs-value = { workspace = true }
cljrs-types = { workspace = true }
cljrs-gc = { workspace = true }
cljrs-reader = { workspace = true }
num-bigint = { workspace = true }
num-rational = { workspace = true }
bigdecimal = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
rpds = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
regex = { workspace = true }
fancy-regex = { workspace = true }
