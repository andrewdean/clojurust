[package]
name = "cljrsh"
version = "0.2.24"
edition = "2024"
description = "cljrsh — Clojure Rust Shell: a babashka-style scripting binary built on clojurust"
license.workspace = true
repository.workspace = true

[[bin]]
name = "cljrsh"
path = "src/main.rs"

[dependencies]
cljrs-stdlib   = { workspace = true }
cljrs-interp   = { workspace = true }
cljrs-builtins = { workspace = true }
cljrs-env      = { workspace = true }
cljrs-value    = { workspace = true }
cljrs-reader   = { workspace = true }
cljrs-types    = { workspace = true }
cljrs-gc       = { workspace = true }
cljrs-async    = { workspace = true }
cljrs-io       = { workspace = true }
cljrs-net      = { workspace = true }
cljrs-charset  = { workspace = true }
cljrs-process  = { workspace = true }
cljrsh-host    = { workspace = true }
cljrsh-project = { workspace = true }
cljrsh-pods    = { workspace = true }
cljrs-nrepl    = { workspace = true }
cljrsh-nu      = { workspace = true, optional = true }
cljrsh-aws     = { workspace = true, optional = true }
cljrsh-k8s     = { workspace = true, optional = true }
cljrs-base64   = { workspace = true }
tokio = { version = "1.50.0", features = ["rt", "sync", "time", "macros"] }
rustyline = { workspace = true }
libc = "0.2"

[features]
default = ["nu", "aws", "k8s"]
# Embedded nushell engine (the `nu` Clojure namespace). Off ⇒ faster builds.
nu = ["dep:cljrsh-nu"]
# Built-in AWS client (the `aws` namespace): S3 + awsJson services.
aws = ["dep:cljrsh-aws"]
# Built-in Kubernetes client (the `k8s` namespace) on kube-rs.
k8s = ["dep:cljrsh-k8s"]

[dev-dependencies]
tempfile = "3"
cljrs-bencode = { workspace = true }
