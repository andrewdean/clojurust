[package]
name = "cljrsh-project"
version = "0.1.0"
edition = "2024"
description = "cljrsh project-file support: bb.edn discovery/parsing and the task graph (paths, tasks, :depends ordering)"
license.workspace = true
repository.workspace = true

[dependencies]
cljrs-reader = { workspace = true }
cljrs-types  = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
regex = { workspace = true }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
